name: invariance-worker

services:
  analysis-worker:
    container_name: invariance-analysis-worker
    build:
      context: ${INVARIANCE_STACK_ROOT:-/home/omenka/Projects}
      dockerfile: invariance_research/Dockerfile.worker
    init: true
    env_file:
      - .env.worker
    environment:
      NODE_ENV: production
      WORKER_MODE: external
      INVARIANCE_WORKER_KIND: analysis-worker
      INVARIANCE_WORKER_INSTANCE_ID: ${INVARIANCE_ANALYSIS_WORKER_INSTANCE_ID:-analysis-worker-1}
      OLLAMA_BASE_URL: http://ollama:11434
      INVARIANCE_PYTHON_BIN: /opt/venv/bin/python
      INVARIANCE_BULLETPROOF_BRIDGE_SCRIPT: /opt/invariance_research/scripts/run_bulletproof_engine.py
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "./node_modules/.bin/tsx", "scripts/healthcheck-worker.ts"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

  export-worker:
    container_name: invariance-export-worker
    build:
      context: ${INVARIANCE_STACK_ROOT:-/home/omenka/Projects}
      dockerfile: invariance_research/Dockerfile.worker
    init: true
    command: ["npm", "run", "worker:export"]
    env_file:
      - .env.worker
    environment:
      NODE_ENV: production
      WORKER_MODE: external
      INVARIANCE_WORKER_KIND: export-worker
      INVARIANCE_WORKER_INSTANCE_ID: ${INVARIANCE_EXPORT_WORKER_INSTANCE_ID:-export-worker-1}
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "./node_modules/.bin/tsx", "scripts/healthcheck-worker.ts"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  experiment-worker:
    container_name: invariance-experiment-worker
    build:
      context: ${INVARIANCE_STACK_ROOT:-/home/omenka/Projects}
      dockerfile: invariance_research/Dockerfile.worker
    init: true
    command: ["npm", "run", "worker:experiment"]
    env_file:
      - .env.worker
    environment:
      NODE_ENV: production
      WORKER_MODE: external
      INVARIANCE_WORKER_KIND: experiment-worker
      INVARIANCE_EXPERIMENT_WORKER_INSTANCE_ID: ${INVARIANCE_EXPERIMENT_WORKER_INSTANCE_ID:-experiment-worker-1}
      INVARIANCE_PYTHON_BIN: /opt/venv/bin/python
      INVARIANCE_BULLETPROOF_ROOT: /opt/bulletproof_bt
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "./node_modules/.bin/tsx", "scripts/healthcheck-worker.ts"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  ollama:
    container_name: invariance-ollama
    image: ollama/ollama:latest
    profiles:
      - llm
    init: true
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

volumes:
  ollama-models:
